name: Mercado, calendario y tesis

on:
  schedule:
    # Desde 2026-10-29: solo 7, 8 y 9 a. m. Colombia (UTC-5), lunes a viernes. Otros horarios: solo si el usuario lo pide.
    - cron: "11 12 * * 1-5"     # 07:11: foto + calendario + cierre diario del día anterior (historia, bonos, valor, tesis)
    - cron: "11 13,14 * * 1-5"  # 08:11 y 09:11: foto de mercado + calendario
  workflow_dispatch:
    inputs:
      diario:
        description: "Ejecutar también el cierre diario"
        type: boolean
        default: false

concurrency:
  group: escritura-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      DIARIO: ${{ github.event.schedule == '11 12 * * 1-5' || inputs.diario == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mercado (Yahoo)
        run: |
          if [ "$DIARIO" = "true" ]; then python -m radar.mercado --diario; else python -m radar.mercado; fi
      - name: Calendario (Forex Factory) con guía para la acción
        continue-on-error: true
        run: python -m radar.calendario
      - name: Tesis de analistas
        if: env.DIARIO == 'true'
        run: python -m radar.tesis
      - name: Subir
        run: bash scripts/subir_datos.sh "mercado"
