name: Mercado, calendario y tesis

on:
  schedule:
    - cron: "11,41 * * * *"  # foto de mercado cada 30 min + calendario
    - cron: "43 22 * * *"    # cierre diario: historia de precios, bonos, valor relativo, tesis
  workflow_dispatch:
    inputs:
      diario:
        description: "Ejecutar también el cierre diario"
        type: boolean
        default: false

concurrency:
  group: escritura-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      DIARIO: ${{ github.event.schedule == '43 22 * * *' || inputs.diario == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calendario (Forex Factory)
        continue-on-error: true
        run: python -m radar.calendario
      - name: Mercado (Yahoo)
        run: |
          if [ "$DIARIO" = "true" ]; then python -m radar.mercado --diario; else python -m radar.mercado; fi
      - name: Tesis de analistas
        if: env.DIARIO == 'true'
        run: python -m radar.tesis
      - name: Subir
        run: bash scripts/subir_datos.sh "mercado"
