name: Noticias (7, 8 y 9 a. m. Colombia, L-V)

on:
  schedule:
    - cron: "4 12-14 * * 1-5"   # 07:04, 08:04 y 09:04 Colombia (UTC-5), lunes a viernes. Otros horarios: solo si el usuario lo pide
  workflow_dispatch:

concurrency:
  group: escritura-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer feeds RSS
        env:
          PYTHONIOENCODING: utf-8
        run: python -m radar.noticias
      - name: Subir
        run: bash scripts/subir_datos.sh "noticias"
