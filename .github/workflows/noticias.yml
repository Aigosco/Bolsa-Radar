name: Noticias (cada 15 min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: escritura-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer feeds RSS
        env:
          PYTHONIOENCODING: utf-8
        run: python -m radar.noticias
      - name: Subir
        run: bash scripts/subir_datos.sh "noticias"
