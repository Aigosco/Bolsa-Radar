name: Lectura con IA (1 al día)

# PAUSADO en la nube mientras la cuenta de la API no tenga saldo: la lectura la hace el PC con Claude Code
# (local/lectura_ia_pc.py, 8:10 Bogotá). Para reactivar aquí, quitar el comentario del horario.
on:
  # schedule:
  #   - cron: "15 13 * * *"    # 08:15 Bogotá: antes de los datos de las 8:30 NY y la apertura (todos los días)
  workflow_dispatch:

concurrency:
  group: escritura-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resumen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lectura con Claude
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python -m radar.resumen
      - name: Subir
        run: bash scripts/subir_datos.sh "lectura IA"
